<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>
  
  <!-- Technical Blueprint Crosshairs -->
  <line x1="20" y1="20" x2="380" y2="20" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="20" y1="300" x2="380" y2="300" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  
  <!-- Scanner Body Wireframe -->
  <g transform="translate(100, 60)" stroke="#00f0ff" stroke-width="2" fill="none">
    <!-- Scanner Head -->
    <path d="M40,20 L160,20 L150,90 L50,90 Z" fill="#0b2447" fill-opacity="0.6"/>
    <!-- Optical Lens Glass Window -->
    <rect x="65" y="30" width="70" height="40" rx="4" stroke="#38bdf8" fill="#0284c7" fill-opacity="0.2"/>
    <ellipse cx="100" cy="50" rx="16" ry="14" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <!-- Pistol Grip Handle -->
    <path d="M75,90 L55,180 L105,180 L115,90 Z" fill="#0e2340" fill-opacity="0.7"/>
    <!-- Trigger Button -->
    <path d="M68,110 C62,115 62,130 68,135" stroke="#E85874" stroke-width="3.5" fill="none"/>
    <!-- Rugged Rubber Boot Bumpers -->
    <path d="M35,20 C35,10 50,15 60,18" stroke="#38bdf8" stroke-width="3"/>
    <path d="M165,20 C165,10 150,15 140,18" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Red Targeting Crosshair & Laser Line -->
  <line x1="120" y1="110" x2="360" y2="110" stroke="#ff0033" stroke-width="2" stroke-opacity="0.85"/>
  <polygon points="170,105 340,90 340,130 170,115" fill="url(#laserBeam)"/>
  
  <!-- Blueprint Technical Tag -->
  <rect x="25" y="260" width="160" height="30" rx="4" fill="#030c1d" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="35" y="278" font-family="monospace" font-size="11" font-weight="bold" fill="#00f0ff">ATPL-SPEC // OPTICAL IMAGER</text>
  <text x="35" y="288" font-family="monospace" font-size="8" fill="#94a3b8">DPM DECODER / IP67 RUGGED</text>
</svg>
