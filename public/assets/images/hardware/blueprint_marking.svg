<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="laserMarkBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="markGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#markBg)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#markGrid)" rx="12"/>

  <!-- Industrial Laser Galvanometer Marking Head -->
  <g transform="translate(110, 40)" stroke="#00f0ff" stroke-width="2" fill="none">
    <!-- Galvo Scan Head Box -->
    <rect x="20" y="20" width="140" height="100" rx="6" fill="#0c2340" fill-opacity="0.8"/>
    <!-- Heat Sink Fins -->
    <line x1="30" y1="20" x2="30" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="45" y1="20" x2="45" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="20" x2="60" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="75" y1="20" x2="75" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="90" y1="20" x2="90" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="20" x2="105" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="120" y1="20" x2="120" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="135" y1="20" x2="135" y2="10" stroke="#38bdf8" stroke-width="2"/>

    <!-- F-Theta Telecentric Focusing Lens -->
    <polygon points="65,120 115,120 105,155 75,155" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="90" cy="155" rx="15" ry="5" fill="#ec4899" fill-opacity="0.4" stroke="#ec4899" stroke-width="1.5"/>

    <!-- Focused Laser Cone -->
    <polygon points="90,155 45,215 135,215" fill="url(#laserMarkBeam)" fill-opacity="0.35" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Steel Component Under Marking -->
    <rect x="25" y="215" width="130" height="25" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Etched DPM 2D DataMatrix on Steel -->
    <rect x="78" y="220" width="24" height="15" fill="#000000" stroke="#ec4899" stroke-width="1"/>
    
    <!-- Sparkles on Focal Point -->
    <circle cx="90" cy="215" r="4" fill="#ffffff"/>
    <line x1="84" y1="215" x2="96" y2="215" stroke="#ffffff" stroke-width="2"/>
    <line x1="90" y1="209" x2="90" y2="221" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Technical Specs -->
  <text x="35" y="285" font-family="monospace" font-size="11" font-weight="bold" fill="#00f0ff">ATPL-SPEC // FIBER LASER DPM</text>
  <text x="35" y="297" font-family="monospace" font-size="8" fill="#94a3b8">1064nm / MIL-STD-130 DIRECT PART MARKING</text>
</svg>

