<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <pattern id="mobGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#mobBg)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#mobGrid)" rx="12"/>

  <!-- Rugged Mobile Terminal Wireframe -->
  <g transform="translate(130, 30)" stroke="#00f0ff" stroke-width="2" fill="none">
    <!-- Outer Heavy Armor Chassis -->
    <rect x="15" y="15" width="110" height="200" rx="14" fill="#0b2447" fill-opacity="0.8"/>
    <!-- Corner Rubber Drop Bumpers -->
    <path d="M15,35 C10,35 10,20 25,15" stroke="#38bdf8" stroke-width="4"/>
    <path d="M125,35 C130,35 130,20 115,15" stroke="#38bdf8" stroke-width="4"/>
    <path d="M15,195 C10,195 10,210 25,215" stroke="#38bdf8" stroke-width="4"/>
    <path d="M125,195 C130,195 130,210 115,215" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Top Scan Engine Window -->
    <rect x="40" y="8" width="60" height="10" rx="3" fill="#ff0033" fill-opacity="0.6" stroke="#ff0033" stroke-width="1.5"/>

    <!-- High-Bright Gorilla Glass Screen -->
    <rect x="25" y="35" width="90" height="115" rx="6" fill="#021428" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- UI Layout on Screen -->
    <rect x="35" y="45" width="70" height="16" rx="3" fill="#0284c7" fill-opacity="0.3"/>
    <text x="40" y="56" font-family="monospace" font-size="7" fill="#00f0ff">ATPL WMS EDGE</text>
    <rect x="35" y="68" width="70" height="40" rx="3" fill="#0369a1" fill-opacity="0.2"/>
    <line x1="42" y1="80" x2="98" y2="80" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="42" y1="92" x2="88" y2="92" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Keypad / Physical Scan Buttons -->
    <rect x="52" y="158" width="36" height="12" rx="4" fill="#E85874" stroke="#ffffff" stroke-width="1"/>
    <text x="60" y="167" font-family="monospace" font-size="7" font-weight="bold" fill="#ffffff">SCAN</text>

    <!-- Keypad Matrix -->
    <circle cx="36" cy="180" r="4" fill="#334155"/>
    <circle cx="50" cy="180" r="4" fill="#334155"/>
    <circle cx="64" cy="180" r="4" fill="#334155"/>
    <circle cx="78" cy="180" r="4" fill="#334155"/>
    <circle cx="92" cy="180" r="4" fill="#334155"/>
    <circle cx="106" cy="180" r="4" fill="#334155"/>
    <circle cx="36" cy="195" r="4" fill="#334155"/>
    <circle cx="50" cy="195" r="4" fill="#334155"/>
    <circle cx="64" cy="195" r="4" fill="#334155"/>
    <circle cx="78" cy="195" r="4" fill="#334155"/>
    <circle cx="92" cy="195" r="4" fill="#334155"/>
    <circle cx="106" cy="195" r="4" fill="#334155"/>
  </g>

  <!-- Technical Specs -->
  <text x="35" y="285" font-family="monospace" font-size="11" font-weight="bold" fill="#00f0ff">ATPL-SPEC // RUGGED MOBILE COMPUTER</text>
  <text x="35" y="297" font-family="monospace" font-size="8" fill="#94a3b8">ANDROID 14 / IP68 / 2.4M DROP CERTIFIED</text>
</svg>
