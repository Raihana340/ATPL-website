<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred — Reconnecting Human Creativity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --ink: #111111;
      --mute: #9a9a9a;
      --sub: #7b7b7b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* =========================================================================
       HERO CONTAINER
       ========================================================================= */
    section.hero {
      position: relative;
      height: 100vh;
      min-height: 660px;
      overflow: hidden;
      background: var(--bg);
    }

    canvas#dots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    nav, div.copy, div.logos {
      position: relative;
      z-index: 3;
    }

    /* =========================================================================
       3.1 NAV
       ========================================================================= */
    nav.nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.6vw, 40px);
      padding-top: 36px;
      font-size: 13.5px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--ink);
      text-decoration: none;
      margin-right: 10px;
    }

    .brand svg {
      width: 16px;
      height: 18px;
      fill: currentColor;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 40px);
    }

    .nav-link {
      color: #3a3a3a;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: #000000;
    }

    .btn-signin {
      background: #111111;
      color: #ffffff;
      padding: 10px 21px;
      border-radius: 999px;
      font-weight: 500;
      text-decoration: none;
      margin-left: 10px;
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .btn-signin:hover {
      transform: translateY(-1px);
    }

    /* =========================================================================
       3.2 COPY BLOCK
       ========================================================================= */
    div.copy {
      position: absolute;
      left: 50%;
      top: 24.5%;
      transform: translateX(-50%);
      text-align: center;
      width: min(92vw, 720px);
    }

    h1 {
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.04;
      font-size: clamp(38px, 3.75vw, 68px);
    }

    h1 span.line-1 {
      display: block;
      color: var(--mute);
    }

    h1 span.line-2 {
      display: block;
      color: var(--ink);
    }

    p.subline {
      margin-top: 20px;
      margin-left: auto;
      margin-right: auto;
      max-width: 340px;
      color: var(--sub);
      font-size: clamp(13px, 1.02vw, 15.5px);
      line-height: 1.4;
    }

    /* Rainbow Underglow Pill CTA */
    .cta-wrapper {
      display: inline-block;
      position: relative;
      margin-top: clamp(34px, 3.6vw, 52px);
    }

    .cta-wrapper::before {
      content: '';
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -6px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(90deg, #ffcf5a, #7dffa8, #5ad7ff, #9b7bff, #ff6fd8, #ffb36b);
      filter: blur(9px);
      opacity: 0.85;
      z-index: 1;
      pointer-events: none;
      transition: bottom 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
    }

    .cta-pill {
      display: inline-block;
      position: relative;
      z-index: 2;
      background: #111111;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 500;
      padding: 11px 20px;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .cta-wrapper:hover .cta-pill {
      transform: translateY(-1px);
    }

    .cta-wrapper:hover::before {
      opacity: 1;
      filter: blur(12px);
      bottom: -9px;
    }

    /* =========================================================================
       3.3 PARTNER LOGOS
       ========================================================================= */
    div.logos {
      position: absolute;
      bottom: clamp(28px, 6vh, 64px);
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 4.6vw, 66px);
      flex-wrap: wrap;
      padding: 0 16px;
      color: #8d8d8d;
      font-size: clamp(14px, 1.18vw, 17px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .logo-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .logo-item:hover {
      color: #111111;
    }

    .logo-item svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* =========================================================================
       5. RESPONSIVE (<760px)
       ========================================================================= */
    @media (max-width: 760px) {
      nav.nav {
        justify-content: space-between;
        padding: 22px 18px 0;
        width: 100%;
      }

      .nav-links {
        display: none;
      }

      div.copy {
        top: 20%;
      }

      div.logos {
        gap: 14px 24px;
        font-size: 13px;
        bottom: 24px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- Dot-Matrix Halftone Canvas -->
    <canvas id="dots"></canvas>

    <!-- Navigation -->
    <nav class="nav">
      <a href="#" class="brand" aria-label="Kindred Home">
        <svg viewBox="0 0 16 18" aria-hidden="true">
          <path d="M2 0h4v18H2zM7 9c3-1 5-4 6-9h3c-1 5-3 8-6 9 3 1 5 4 6 9h-3c-1-5-3-8-6-9z"/>
        </svg>
        <span>Kindred</span>
      </a>

      <div class="nav-links">
        <a href="#platform" class="nav-link">Platform</a>
        <a href="#marketplace" class="nav-link">Marketplace</a>
        <a href="#creators" class="nav-link">Creators</a>
        <a href="#resources" class="nav-link">Resources</a>
        <a href="#company" class="nav-link">Company</a>
      </div>

      <a href="#signin" class="btn-signin">Sign In</a>
    </nav>

    <!-- Copy Block -->
    <div class="copy">
      <h1>
        <span class="line-1">Reconnecting</span>
        <span class="line-2">Human Creativity.</span>
      </h1>
      <p class="subline">
        We’re not building another platform. We’re building a place where people belong.
      </p>

      <div class="cta-wrapper">
        <a href="#join" class="cta-pill">Join the circle</a>
      </div>
    </div>

    <!-- Partner Logos -->
    <div class="logos">
      <!-- 1. Lumenix (leaf) -->
      <div class="logo-item" title="Lumenix">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 15c0-7 5-12 14-12-1 9-6 14-13 13l-1 2-2-1z"/>
        </svg>
        <span>Lumenix</span>
      </div>

      <!-- 2. Velora (hexagon ring) -->
      <div class="logo-item" title="Velora">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 1l8 4.5v9L10 19l-8-4.5v-9zM10 6l-4 2.3v4.4L10 15l4-2.3V8.3z"/>
        </svg>
        <span>Velora</span>
      </div>

      <!-- 3. Nimbus (double wave) -->
      <div class="logo-item" title="Nimbus">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M1 5q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0zm0 7q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0z"/>
        </svg>
        <span>Nimbus</span>
      </div>

      <!-- 4. Quanta (concentric rings) -->
      <div class="logo-item" title="Quanta">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 1a9 9 0 110 18 9 9 0 010-18zm0 3a6 6 0 100 12 6 6 0 000-12zm0 3a3 3 0 110 6 3 3 0 010-6z"/>
        </svg>
        <span>Quanta</span>
      </div>

      <!-- 5. Solstice (two peaks) -->
      <div class="logo-item" title="Solstice">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M1 17L7 6l3 5 3-7 6 13z"/>
        </svg>
        <span>Solstice</span>
      </div>

      <!-- 6. Parallax (stacked layers) -->
      <div class="logo-item" title="Parallax">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 1l9 4-9 4-9-4zm-9 8l9 4 9-4v3l-9 4-9-4zm0 5l9 4 9-4v2l-9 4-9-4z"/>
        </svg>
        <span>Parallax</span>
      </div>
    </div>
  </section>

  <!-- =========================================================================
       4. THE DOT-MATRIX HANDS ENGINE
       ========================================================================= -->
  <script>
    (function () {
      const SHEET_URL = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_025250_100df7b8-31fd-4614-aa4a-c1b7d5b6b273.png&w=1600&q=85';

      // 4 Hand Rects on 2x2 Sheet [x, y, w, h] (fractions)
      const RECTS = {
        LA: [0.00, 0.06, 0.47, 0.40], // Pointing left (Adam)
        RA: [0.53, 0.06, 0.47, 0.40], // Pointing right (God)
        LB: [0.00, 0.55, 0.47, 0.40], // Open left hand
        RB: [0.53, 0.55, 0.47, 0.40]  // Open right hand
      };

      const canvas = document.getElementById('dots');
      const ctx = canvas.getContext('2d', { alpha: true });

      // Offscreen field canvases for sampling luminance (cols x rows)
      const fA = document.createElement('canvas');
      const fB = document.createElement('canvas');
      const ctxA = fA.getContext('2d', { willReadFrequently: true });
      const ctxB = fB.getContext('2d', { willReadFrequently: true });

      // State
      let tiles = null;
      let W = 0, H = 0, DPR = 1;
      let step = 7, rowStep = 14;
      let cols = 0, rows = 0;
      let R = 3.2;
      let seeds = null;
      let isReady = false;

      // Mathematical helpers
      function fract(x) {
        return x - Math.floor(x);
      }

      function hash(a, b) {
        return fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
      }

      function clamp(x, min, max) {
        return Math.min(max, Math.max(min, x));
      }

      function smooth(a, b, x) {
        const t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function mixAt(t, on, off, dur) {
        return smooth(on, on + dur, t) * (1 - smooth(off, off + dur, t));
      }

      // Pre-downscale tile creation (420px wide per rect)
      function createTile(img, rect) {
        const tileW = 420;
        const sw = rect[2] * img.naturalWidth;
        const sh = rect[3] * img.naturalHeight;
        const sx = rect[0] * img.naturalWidth;
        const sy = rect[1] * img.naturalHeight;
        const tileH = Math.round(tileW * (sh / sw));

        const c = document.createElement('canvas');
        c.width = tileW;
        c.height = tileH;
        const cCtx = c.getContext('2d');
        cCtx.imageSmoothingEnabled = true;
        cCtx.imageSmoothingQuality = 'high';
        cCtx.drawImage(img, sx, sy, sw, sh, 0, 0, tileW, tileH);
        return { canvas: c, width: tileW, height: tileH };
      }

      // Procedural fallback generator if image is loading or blocked by network
      function createFallbackTile(isLeft, isOpen) {
        const tileW = 420;
        const tileH = 260;
        const c = document.createElement('canvas');
        c.width = tileW;
        c.height = tileH;
        const cCtx = c.getContext('2d');
        cCtx.fillStyle = '#ffffff';
        cCtx.fillRect(0, 0, tileW, tileH);

        // Draw soft hand silhouette
        const grad = cCtx.createRadialGradient(
          isLeft ? tileW * 0.7 : tileW * 0.3, tileH * 0.5, 10,
          isLeft ? tileW * 0.5 : tileW * 0.5, tileH * 0.5, 160
        );
        grad.addColorStop(0, '#111111');
        grad.addColorStop(0.55, '#444444');
        grad.addColorStop(0.85, '#999999');
        grad.addColorStop(1, '#ffffff');

        cCtx.fillStyle = grad;
        cCtx.beginPath();
        if (isLeft) {
          cCtx.ellipse(tileW * 0.45, tileH * 0.5, 170, 75, isOpen ? 0.15 : -0.05, 0, Math.PI * 2);
          cCtx.rect(0, tileH * 0.25, tileW * 0.4, tileH * 0.5);
        } else {
          cCtx.ellipse(tileW * 0.55, tileH * 0.5, 170, 75, isOpen ? -0.15 : 0.05, 0, Math.PI * 2);
          cCtx.rect(tileW * 0.6, tileH * 0.25, tileW * 0.4, tileH * 0.5);
        }
        cCtx.fill();

        return { canvas: c, width: tileW, height: tileH };
      }

      // Resize and recompute grids
      function onResize() {
        const parent = canvas.parentElement || document.body;
        W = parent.clientWidth || window.innerWidth;
        H = parent.clientHeight || window.innerHeight;
        DPR = Math.min(2, window.devicePixelRatio || 1);

        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);

        step = Math.max(5, W / 205);
        rowStep = step * 2.05;

        cols = Math.ceil(W / step);
        rows = Math.ceil(H / rowStep);
        R = step * 0.46;

        fA.width = cols;
        fA.height = rows;
        fB.width = cols;
        fB.height = rows;

        // Per-cell dissolve seeds
        seeds = new Float32Array(cols * rows);
        for (let j = 0; j < rows; j++) {
          const rowNoise = hash(j * 3.1, 7.7);
          for (let i = 0; i < cols; i++) {
            seeds[j * cols + i] = 0.55 * hash(i, j) + 0.45 * rowNoise;
          }
        }
      }

      // Draw single hand tile into field canvas with exact transform
      function drawHandToField(fCtx, tile, isLeft, a, isPortrait) {
        const ph = isLeft ? 0 : Math.PI;
        const reach = (0.035 * Math.sin(a + ph) + 0.012 * Math.sin(2 * a + 1.3 + ph)) * W;
        const scale = 1 + 0.07 * Math.sin(a + 0.9 + ph);
        const rot = (isLeft ? 1 : -1) * 0.045 * Math.sin(a + 2.1 + ph);
        const hw = isPortrait ? W * 0.66 : W * 0.53;
        const hh = hw * (0.40 * 1520) / (0.47 * 2688);
        const cy = isPortrait ? H * 0.66 : H * 0.54;
        const x = isLeft ? (reach - W * 0.045) : (W - hw + W * 0.045 - reach);
        const pivotX = isLeft ? 0 : W;
        const pivotY = cy;

        fCtx.save();
        fCtx.scale(cols / W, rows / H);
        fCtx.translate(pivotX, pivotY);
        fCtx.rotate(rot);
        fCtx.scale(scale, scale);
        fCtx.translate(-pivotX, -pivotY);
        fCtx.drawImage(tile.canvas, x, cy - hh / 2, hw, hh);
        fCtx.restore();
      }

      // Main render function
      function render(seconds) {
        if (!isReady || cols === 0 || rows === 0) return;

        const LOOP = 20;
        const tLoop = ((seconds % LOOP) + LOOP) % LOOP;
        const a = (2 * Math.PI * tLoop) / LOOP;
        const isPortrait = H > W;

        // Pose switches (glitch dissolve)
        const mL = mixAt(tLoop, 6.2, 14.6, 1.6);
        const mR = mixAt(tLoop, 2.4, 10.4, 1.6);
        const tick = Math.floor(tLoop * 7);

        // 1. Fill fields with white
        ctxA.fillStyle = '#ffffff';
        ctxA.fillRect(0, 0, cols, rows);
        ctxB.fillStyle = '#ffffff';
        ctxB.fillRect(0, 0, cols, rows);

        // 2. Draw Pose A into fA (LA + RA), Pose B into fB (LB + RB)
        drawHandToField(ctxA, tiles.LA, true, a, isPortrait);
        drawHandToField(ctxA, tiles.RA, false, a, isPortrait);
        drawHandToField(ctxB, tiles.LB, true, a, isPortrait);
        drawHandToField(ctxB, tiles.RB, false, a, isPortrait);

        // 3. Read image data
        const dataA = ctxA.getImageData(0, 0, cols, rows).data;
        const dataB = ctxB.getImageData(0, 0, cols, rows).data;

        // 4. Row glitch table
        const rowShifts = new Int32Array(rows);
        for (let j = 0; j < rows; j++) {
          if (hash(j, tick) > 0.965) {
            rowShifts[j] = Math.round((hash(tick, j) - 0.5) * 8);
          } else {
            rowShifts[j] = 0;
          }
        }

        // 5. Draw on visible canvas
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d0d0d';

        const quietXCenter = isPortrait ? 0.44 : 0.2;
        const quietYCenter = isPortrait ? 0.33 : 0.385;

        // Begin batched path for peak 60fps performance
        ctx.beginPath();

        for (let j = 0; j < rows; j++) {
          const shift = rowShifts[j];
          const rowOffset = j * cols;
          const yCenter = (j + 0.5) * rowStep;
          const ey = (yCenter / H - quietYCenter) / 0.085;

          for (let i = 0; i < cols; i++) {
            const sampledI = clamp(i - shift, 0, cols - 1);
            const idx = (rowOffset + sampledI) * 4;
            const seed = seeds[rowOffset + i];
            const m = i < (cols / 2) ? mL : mR;
            const useB = seed < m;

            const red = useB ? dataB[idx] : dataA[idx];
            const lum = red / 255;
            let v = clamp((1 - lum - 0.16) / 0.42, 0, 1);

            if (v <= 0) continue;

            // Shimmer
            v *= 0.86 + 0.14 * Math.sin(tLoop * 3.2 + seed * 40);

            // Center fade: fingertips dissolve just before CTA
            const cx = Math.abs((i + 0.5) / cols - 0.5);
            v *= smooth(0.035, 0.11, cx);

            // Copy quiet zone: no dots across headline and subline
            const ex = cx / quietXCenter;
            v *= smooth(0.85, 1.25, Math.hypot(ex, ey));

            // Dissolve transition front
            if (m > 0.001 && m < 0.999) {
              const diff = Math.abs(seed - m);
              if (diff < 0.12) {
                let mult = diff / 0.12;
                if (hash(i + tick, j) <= 0.4) mult *= 0.3;
                v *= mult;
              }
            }

            // Quantise to LEVELS: [0, 0.26, 0.52, 0.78, 1]
            let chosenLevel = 0;
            if (v >= 1.0 - 0.13) chosenLevel = 1.0;
            else if (v >= 0.78 - 0.13) chosenLevel = 0.78;
            else if (v >= 0.52 - 0.13) chosenLevel = 0.52;
            else if (v >= 0.26 - 0.13) chosenLevel = 0.26;

            if (chosenLevel === 0) continue;

            // Radius calculation: level 0.26 uses R * 0.38 for fine pinpoint dots
            const dotR = (chosenLevel === 0.26) ? (R * 0.38) : (R * chosenLevel);
            const dotX = (i + 0.5) * step;

            // Fast path circle command
            ctx.moveTo(dotX + dotR, yCenter);
            ctx.arc(dotX, yCenter, dotR, 0, Math.PI * 2);
          }
        }

        ctx.fill();
      }

      // Expose render for deterministic recorders
      window.__render = render;

      // Animation frame driver
      let t0 = performance.now();
      function tickLoop(now) {
        render((now - t0) / 1000);
        requestAnimationFrame(tickLoop);
      }

      // Initialize
      window.addEventListener('resize', onResize);
      onResize();

      // Create initial procedural fallbacks so canvas is active immediately
      tiles = {
        LA: createFallbackTile(true, false),
        RA: createFallbackTile(false, false),
        LB: createFallbackTile(true, true),
        RB: createFallbackTile(false, true)
      };
      isReady = true;
      requestAnimationFrame(tickLoop);

      // Load photographic source sheet with CORS
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        tiles = {
          LA: createTile(img, RECTS.LA),
          RA: createTile(img, RECTS.RA),
          LB: createTile(img, RECTS.LB),
          RB: createTile(img, RECTS.RB)
        };
      };
      img.onerror = () => {
        console.warn('Higgsfield hand sheet load error, running on procedural high-res fallback.');
      };
      img.src = SHEET_URL;
    })();
  </script>
</body>
</html>
